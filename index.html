<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student E-Portfolio</title>

  <!-- Connection 1: External CSS Link -->
  <link rel="stylesheet" href="style.css">

  <!-- Connection 2: External JavaScript Link -->
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <nav>
      <h2>Clyde Wedan C. Abia</h2>
      <!-- Dynamic Target 1: Dark Mode Toggle -->
      <button id="theme-btn">Toggle Dark Mode</button>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h1>Welcome to My E-Portfolio</h1>
      <p>1st Year Information Technology Student</p>
    </section>

    <section id="projects">
      <h2>Featured Projects</h2>
      <div class="card">
        <h3>Web Integration Lab</h3>
        <p>A demonstration of linking HTML, CSS, and JS.</p>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <!-- Dynamic Target 2: Interactive Alert Button -->
      <button id="contact-btn">Get in Touch</button>
    </section>
  </main>

  <footer>
    <!-- Dynamic Target 3: Year Injection -->
    <p>&copy; <span id="year"></span> All Rights Reserved.</p>
  </footer>

</body>
</html>
